CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# Enable GPIO
CONFIG_GPIO=y

# Enable I2C with target/slave mode
CONFIG_I2C=y
CONFIG_I2C_TARGET=y

# Enable UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Enable threads and synchronization
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=15

# No heap.
#
# Nothing in this firmware allocates: there is no malloc, calloc, realloc,
# strdup or k_malloc anywhere in src/ or proto/.  The 8 KB pool this used to
# reserve was 22 % of the board's 36 KB of RAM, held for callers that do not
# exist.  If something ever does need it, raise this rather than reaching for
# the C library -- a fixed pool is the thing that can be reasoned about.
CONFIG_HEAP_MEM_POOL_SIZE=0

# Enable system clock
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=64000000

# Enable logging subsystem
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PRINTK=y

# Enable nanopb for protobuf support
CONFIG_NANOPB=y

# No floating point in format strings.
#
# Every conversion this firmware uses is %s, %d, %u, %c or %lx with a width:
# no %f, %e or %g, and no %ll.  Enabling FP support pulled in _dtoa_r and the
# whole soft-float double library -- __aeabi_dadd, dsub, dmul and ddiv alone
# are 5.5 KB of flash -- to format numbers nobody prints.
CONFIG_CBPRINTF_FP_SUPPORT=n

# newlib, in its nano flavour.
#
# Full newlib links _svfprintf_r, the float-capable printf, at 6.7 KB, plus
# _dtoa_r at 4 KB and the malloc implementation at 2.2 KB, and carries a 656 B
# reentrancy struct, a 1032 B malloc arena and a 364 B locale in RAM.  The nano
# variant supports every conversion listed above and costs 28 KB of flash less.
#
# The one thing it does not do is %f and long long.  Both are checked for above;
# if either ever becomes necessary, this is the line to revisit, not something
# to work around at the call site.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# Enable minimal libc
CONFIG_MINIMAL_LIBC=n

# main() initialises the peripherals and returns; the work happens in the
# threads below.  4096 was sized for full newlib's printf, which is no longer
# what gets linked.  2048 is deliberately more than the call graph appears to
# need: nobody has measured the real high-water mark, and that wants
# CONFIG_THREAD_ANALYZER on a board rather than a guess from the source.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=2048

# Enable stack overflow detection for debugging
CONFIG_STACK_SENTINEL=y

# Enable thread names
CONFIG_THREAD_NAME=y

# Enable thread runtime stats
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_STACK_INFO=y
