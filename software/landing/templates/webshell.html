<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CybICS - WebShell</title>
    <script>(function(){if(new URLSearchParams(location.search).get("theme")==="light")document.documentElement.classList.add("light-mode");})();</script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff6b00;
        }

        header {
            background-color: #2d2d2d;
            color: #ff6b00;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6b00;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .back-button {
            background-color: #404040;
            color: #ff6b00;
            border: 1px solid #ff6b00;
            border-radius: 0.25rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-button:hover {
            background-color: #ff6b00;
            color: #1a1a1a;
        }

        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow: hidden;
        }

        .terminal-output {
            flex: 1;
            background-color: #0a0a0a;
            border: 2px solid #404040;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-y: auto;
            margin-bottom: 1rem;
            font-size: 14px;
            line-height: 1.5;
        }

        .terminal-line {
            margin-bottom: 0.5rem;
        }

        .terminal-prompt {
            color: #00ff00;
        }

        .terminal-command {
            color: #ffffff;
        }

        .terminal-output-text {
            color: #cccccc;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .terminal-error {
            color: #ff4444;
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            background-color: #2d2d2d;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 2px solid #404040;
        }

        .terminal-input {
            flex: 1;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #404040;
            border-radius: 0.25rem;
            padding: 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .terminal-input:focus {
            outline: none;
            border-color: #ff6b00;
        }

        .execute-button {
            background-color: #ff6b00;
            color: #1a1a1a;
            border: none;
            border-radius: 0.25rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
        }

        .execute-button:hover {
            background-color: #ff8c42;
        }

        .execute-button:disabled {
            background-color: #404040;
            color: #666666;
            cursor: not-allowed;
        }

        .clear-button {
            background-color: #404040;
            color: #ffffff;
            border: 1px solid #606060;
            border-radius: 0.25rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
        }

        .clear-button:hover {
            background-color: #606060;
        }

        .quick-commands {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .quick-command-btn {
            background-color: #2d2d2d;
            color: #ff6b00;
            border: 1px solid #404040;
            border-radius: 0.25rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
        }

        .quick-command-btn:hover {
            background-color: #404040;
            border-color: #ff6b00;
        }

        .info-banner {
            background-color: #2d2d2d;
            border: 1px solid #ff6b00;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
            color: #cccccc;
            font-size: 12px;
        }

        .info-banner strong {
            color: #ff6b00;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #404040;
            border-top-color: #ff6b00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Dashboard theme bridge */
        html.light-mode, html.light-mode body { background: #f3f5f8 !important; color: #172033 !important; }
        html.light-mode header, html.light-mode .input-container, html.light-mode .info-banner, html.light-mode .quick-command-btn { background-color: #ffffff !important; color: #172033 !important; border-color: #d8dde6; }
        html.light-mode .terminal-output { background-color: #ffffff !important; border-color: #b7bfcc; box-shadow: inset 0 0 0 1px #eef1f5; }
        html.light-mode .terminal-output-text { color: #394355; }
        html.light-mode .terminal-command { color: #7c3f00; }
        html.light-mode .terminal-input { background-color: #f7f8fa !important; color: #172033 !important; border-color: #b7bfcc; }
        html.light-mode .terminal-prompt { color: #15803d; }
        html.light-mode .terminal-error { color: #dc2626; }
        html.light-mode .info-banner { color: #394355; }
        html.light-mode .quick-command-btn { color: #b34700; }
        html.light-mode .quick-command-btn:hover, html.light-mode .clear-button:hover { background-color: #eef1f5; }
        html.light-mode .clear-button { background-color: #eef1f5; color: #394355; border-color: #b7bfcc; }
        html.light-mode h1, html.light-mode .info-banner strong { color: #b34700; }
        html.light-mode ::-webkit-scrollbar-track { background: #e7eaf0; }
        html.light-mode ::-webkit-scrollbar-thumb { background: #b7bfcc; }
    </style>
</head>
<body>
    <header>
        <h1>WebShell - Attack Tools</h1>
    </header>

    <div class="terminal-container">
        <div class="info-banner">
            <strong>WebShell Terminal</strong> - Execute attack tools like nmap, netcat, curl, flooding_hpt.py, etc.
        </div>

        <div class="quick-commands">
            <button class="quick-command-btn" onclick="insertCommand('flooding_hpt.py localhost --duration 10')">flooding_hpt.py 10s</button>
            <button class="quick-command-btn" onclick="insertCommand('flooding_hpt.py localhost --duration 60')">flooding_hpt.py 60s</button>
            <button class="quick-command-btn" onclick="insertCommand('nmap -sV localhost')">nmap -sV</button>
            <button class="quick-command-btn" onclick="insertCommand('nmap -p- localhost')">nmap -p-</button>
            <button class="quick-command-btn" onclick="insertCommand('ip a')">ip a</button>
            <button class="quick-command-btn" onclick="insertCommand('netstat -tulpn')">netstat</button>
            <button class="quick-command-btn" onclick="insertCommand('ps aux')">ps aux</button>
            <button class="quick-command-btn" onclick="insertCommand('whoami')">whoami</button>
            <button class="quick-command-btn" onclick="insertCommand('pwd')">pwd</button>
            <button class="quick-command-btn" onclick="insertCommand('ls -la')">ls -la</button>
        </div>

        <div class="terminal-output" id="terminal-output">
            <div class="terminal-line">
                <span class="terminal-output-text">WebShell v1.0 - CybICS Training Platform</span>
            </div>
            <div class="terminal-line">
                <span class="terminal-output-text">Type commands below or use quick command buttons.</span>
            </div>
            <div class="terminal-line">
                <span class="terminal-output-text">---</span>
            </div>
        </div>

        <div class="input-container">
            <input
                type="text"
                class="terminal-input"
                id="command-input"
                placeholder="Enter command (e.g., nmap -sV 10.0.0.10)"
                autocomplete="off"
            >
            <button class="execute-button" id="execute-btn" onclick="executeCommand()">Execute</button>
            <button class="clear-button" id="stop-btn" onclick="stopCommand()" disabled>Stop</button>
            <button class="clear-button" onclick="clearTerminal()">Clear</button>
        </div>
    </div>

    <script>
        function applyDashboardTheme(theme) {
            document.documentElement.classList.toggle('light-mode', theme === 'light');
        }
        fetch('/api/settings/theme').then(function (response) { return response.json(); }).then(function (data) { applyDashboardTheme(data.theme || 'dark'); }).catch(function () {});
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'theme') applyDashboardTheme(event.data.theme);
        });

        const terminalOutput = document.getElementById('terminal-output');
        const commandInput = document.getElementById('command-input');
        const executeBtn = document.getElementById('execute-btn');
        const stopBtn = document.getElementById('stop-btn');
        let commandHistory = [];
        let historyIndex = -1;

        // Commands run as server-side background jobs; the terminal log and the
        // active job are mirrored to sessionStorage so a running scan survives
        // navigating away from this page and coming back within the same tab.
        const LOG_KEY = 'cybics_webshell_log';
        const ACTIVE_KEY = 'cybics_webshell_active';
        const POLL_MS = 1000;
        let pollTimer = null;

        function persistLog() {
            try { sessionStorage.setItem(LOG_KEY, terminalOutput.innerHTML); } catch (e) {}
        }
        function restoreLog() {
            try {
                const saved = sessionStorage.getItem(LOG_KEY);
                if (saved !== null) terminalOutput.innerHTML = saved;
            } catch (e) {}
        }
        function setActiveJob(job) {
            try { sessionStorage.setItem(ACTIVE_KEY, JSON.stringify(job)); } catch (e) {}
        }
        function clearActiveJob() {
            try { sessionStorage.removeItem(ACTIVE_KEY); } catch (e) {}
        }
        function getActiveJob() {
            try { return JSON.parse(sessionStorage.getItem(ACTIVE_KEY) || 'null'); } catch (e) { return null; }
        }

        // Handle Enter key
        commandInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !executeBtn.disabled) {
                executeCommand();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (commandHistory.length > 0) {
                    historyIndex = Math.min(historyIndex + 1, commandHistory.length - 1);
                    commandInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    commandInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = -1;
                    commandInput.value = '';
                }
            }
        });

        function insertCommand(cmd) {
            commandInput.value = cmd;
            commandInput.focus();
        }

        function addTerminalLine(content, className = '') {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            if (className) {
                line.classList.add(className);
            }
            line.innerHTML = content;
            terminalOutput.appendChild(line);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
            persistLog();
        }

        function clearTerminal() {
            terminalOutput.innerHTML = `
                <div class="terminal-line">
                    <span class="terminal-output-text">Terminal cleared.</span>
                </div>
            `;
            persistLog();
        }

        // Create the streaming output element for a job. Tagged with data-job so
        // it can be found again after the log is restored from sessionStorage.
        function createOutputElement(jobId) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            const span = document.createElement('span');
            span.className = 'terminal-output-text';
            span.setAttribute('data-job', jobId);
            line.appendChild(span);
            terminalOutput.appendChild(line);
            return span;
        }

        function appendChunk(outEl, text) {
            outEl.textContent += text;
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
            persistLog();
        }

        function setRunning(running) {
            executeBtn.disabled = running;
            stopBtn.disabled = !running;
            executeBtn.innerHTML = running ? 'Running<span class="loading"></span>' : 'Execute';
        }

        function finishRun() {
            if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
            clearActiveJob();
            setRunning(false);
            commandInput.focus();
        }

        async function executeCommand() {
            const command = commandInput.value.trim();
            if (!command || executeBtn.disabled) {
                return;
            }

            // Add to history
            commandHistory.unshift(command);
            historyIndex = -1;

            // Display command
            addTerminalLine(`<span class="terminal-prompt">root@cybics:~$</span> <span class="terminal-command">${escapeHtml(command)}</span>`);

            commandInput.value = '';
            setRunning(true);

            try {
                const response = await fetch('/api/webshell/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });
                const data = await response.json();

                if (!data.success || !data.job_id) {
                    addTerminalLine(`<span class="terminal-error">Error: ${escapeHtml(data.output || 'could not start command')}</span>`);
                    addTerminalLine('<span class="terminal-output-text">---</span>');
                    finishRun();
                    return;
                }

                const outEl = createOutputElement(data.job_id);
                setActiveJob({ job_id: data.job_id, offset: 0 });
                persistLog();
                pollJob(data.job_id, outEl, 0);
            } catch (error) {
                addTerminalLine(`<span class="terminal-error">Request failed: ${escapeHtml(error.message)}</span>`);
                addTerminalLine('<span class="terminal-output-text">---</span>');
                finishRun();
            }
        }

        // Poll a background job for incremental output until it finishes.
        async function pollJob(jobId, outEl, offset) {
            let data;
            try {
                const r = await fetch(`/api/webshell/jobs/${jobId}?offset=${offset}`);
                if (r.status === 404) {
                    appendChunk(outEl, '\n[job is no longer available]\n');
                    addTerminalLine('<span class="terminal-output-text">---</span>');
                    finishRun();
                    return;
                }
                data = await r.json();
            } catch (error) {
                // Transient error (e.g. mid-navigation); retry shortly.
                pollTimer = setTimeout(() => pollJob(jobId, outEl, offset), POLL_MS);
                return;
            }

            if (data.chunk) appendChunk(outEl, data.chunk);
            offset = data.offset;
            setActiveJob({ job_id: jobId, offset: offset });

            if (data.running) {
                pollTimer = setTimeout(() => pollJob(jobId, outEl, offset), POLL_MS);
            } else {
                if (data.exit_code !== 0 && data.exit_code !== null) {
                    addTerminalLine(`<span class="terminal-error">Exit code: ${data.exit_code}</span>`);
                }
                addTerminalLine('<span class="terminal-output-text">---</span>');
                finishRun();
            }
        }

        async function stopCommand() {
            const active = getActiveJob();
            if (!active || !active.job_id) return;
            stopBtn.disabled = true;
            try {
                await fetch(`/api/webshell/jobs/${active.job_id}/kill`, { method: 'POST' });
            } catch (e) {}
        }

        // Reattach to an in-progress job after the page (re)loads.
        function resumeActiveJob() {
            const active = getActiveJob();
            if (!active || !active.job_id) return;
            let outEl = terminalOutput.querySelector(`[data-job="${active.job_id}"]`);
            if (!outEl) outEl = createOutputElement(active.job_id);
            setRunning(true);
            pollJob(active.job_id, outEl, active.offset || 0);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-scroll terminal output
        const observer = new MutationObserver(() => {
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        });
        observer.observe(terminalOutput, { childList: true, subtree: true });

        // Restore previous session output and reattach to any running job.
        restoreLog();
        resumeActiveJob();
        commandInput.focus();
    </script>
</body>
</html>
