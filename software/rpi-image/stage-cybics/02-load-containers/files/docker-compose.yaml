# CybICS Docker Compose for Pi-Gen Image
# Uses local image names (loaded from tarballs on first boot)
services:
  # The virtual 3D/classic plant view, reused on the board in display mode:
  # it reads the live values hwio (the bridge) wrote to OpenPLC and only
  # renders them. Same image as the virtual stack; HWIO_MODE picks the source.
  hwio-view:
    image: cybics-hwio:latest
    depends_on:
    - openplc
    restart: always
    mem_limit: 192m
    environment:
    - HWIO_MODE=display
    ports:
    - 8090:8090
    networks:
      br-cybics:
        ipv4_address: 172.18.0.13
  hwio:
    image: cybics-hwio-raspberry:latest
    depends_on:
    - stm32
    - openplc
    restart: always
    privileged: true
    mem_limit: 48m
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # hwio reads the board revision straps at startup and publishes them
      # here, together with the STM32 UID; the landing page mounts the same
      # volume read-only.
      - cybics_state:/var/lib/cybics
      # The landing page asks for uplink Wi-Fi settings here (central CTF
      # server); hwio applies them with nmcli, see ctf_uplink.py.
      - cybics_uplink:/var/lib/cybics-uplink
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/gpiochip0:/dev/gpiochip0"
    networks:
      br-cybics:
        ipv4_address: 172.18.0.2

  opcua:
    cap_add:
      - NET_ADMIN
    image: cybics-opcua:latest
    depends_on:
    - openplc
    restart: always
    mem_limit: 64m
    ports:
      - 4840:4840
    networks:
      br-cybics:
        ipv4_address: 172.18.0.5

  s7com:
    image: cybics-s7com:latest
    depends_on:
    - openplc
    restart: always
    mem_limit: 32m
    ports:
      - 1102:1102
    networks:
      br-cybics:
        ipv4_address: 172.18.0.6

  openplc:
    image: cybics-openplc:latest
    restart: always
    mem_limit: 96m
    volumes:
      - /var/run:/var/run
    ports:
      - 44818:44818
      - 20000:20000
      - 8080:8080
      - 502:502
      - 102:102
    networks:
      br-cybics:
        ipv4_address: 172.18.0.3

  fuxa:
    image: cybics-fuxa:latest
    restart: always
    mem_limit: 80m
    depends_on:
    - openplc
    ports:
      - 1881:1881
    volumes:
      - fuxa_data:/_appdata
    networks:
      br-cybics:
        ipv4_address: 172.18.0.4

  landing:
    image: cybics-landing:latest
    restart: always
    mem_limit: 64m
    depends_on:
    - openplc
    - fuxa
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cybics_state:/var/lib/cybics:ro
      - cybics_uplink:/var/lib/cybics-uplink
      # CTF progress and the central CTF enrolment survive an update.
      - landing_data:/CybICS/data
    environment:
      # Enrol with a central CTF server as a board, identified by its STM32 UID.
      - CYBICS_PLATFORM=physical

  stm32:
    image: cybics-stm32:latest
    privileged: true
    restart: always
    mem_limit: 32m
    # OpenOCD's GDB server halts the core on any incoming connection, and
    # nothing resumes it when the client disconnects. A service scan against
    # the device therefore stopped the physical process (#162). Only the Pi
    # itself may reach the port; debug from a workstation through an SSH
    # tunnel, see software/stm32/README.md.
    ports:
      - 127.0.0.1:3333:3333
    networks:
      br-cybics:
        ipv4_address: 172.18.0.7

  # Must match software/docker-compose.yaml: the proxy config resolves its
  # upstream as "hostnet", and it publishes 8082 (plain, TCP passthrough) plus
  # one TLS port per embedded service (service port + 10000) so the dashboard
  # can embed them without mixed content when served over HTTPS.
  nginx-proxy:
    image: cybics-nginx-proxy:latest
    restart: always
    mem_limit: 32m
    ports:
      - 8082:80
      - 443:443
      - 11881:11881
      - 16080:16080
      - 16081:16081
      - 18080:18080
      - 18090:18090
      - 18443:18443
    extra_hosts:
      - "hostnet:host-gateway"
    depends_on:
      - landing
    volumes:
      - nginx-certs:/etc/nginx/certs
    networks:
      br-cybics:
        ipv4_address: 172.18.0.12

  ids:
    image: cybics-ids:latest
    restart: always
    mem_limit: 32m
    depends_on:
    - openplc
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

networks:
  br-cybics:
    name: br-cybics
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-cybics
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1

volumes:
  cybics_state:
  cybics_uplink:
  landing_data:
  fuxa_data:
  nginx-certs:
