# Single sidecar proxy in front of the landing page, serving two purposes.
#
# The `landing` service runs with network_mode: host and binds 0.0.0.0:80.
# "hostnet" is mapped to the Docker host via extra_hosts: host-gateway.
#
#   :80  (published as 8082) -- raw TCP passthrough.
#       On hosts with a firewall (e.g. ufw) the host's port 80 lives on the
#       INPUT chain and is blocked from other machines, while bridge-published
#       ports bypass the firewall via Docker's iptables rules. Proxying at the
#       TCP layer keeps HTTP, WebSockets and SSE transparent -- no headers are
#       rewritten and nothing is buffered.
#
#   :443 -- HTTPS with a self-signed certificate generated on first start.
#       This one has to terminate TLS, so it proxies at the HTTP layer.
#
# Both were separate containers before (landing-proxy and nginx-proxy); they
# pointed at the same upstream and only differed in which layer they worked at.

events {}

# Raw TCP passthrough for plain HTTP access.
stream {
    server {
        listen 80;
        proxy_pass hostnet:80;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Only send "Connection: upgrade" for an actual WebSocket handshake.
    # Sending it unconditionally breaks keep-alive on ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The landing dashboard itself.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/tls.conf;

        location / {
            proxy_pass http://hostnet:80;
            include /etc/nginx/proxy.conf;
        }
    }

    # One TLS listener per embedded service, each on its own port (service port
    # + 10000).  The dashboard embeds these as iframes, and an http:// iframe
    # inside an https:// page is active mixed content that browsers block -- so
    # over TLS the iframes point here instead.
    #
    # Deliberately a port per service rather than paths under one origin: these
    # apps emit absolute paths (NiceGUI serves /static/..., the IDS page links
    # href="/", noVNC loads websockify absolutely) and none of them support a
    # base path, so path-proxying would break them.  Giving each its own port
    # keeps every app at an origin root, so nothing has to be rewritten.
    # openplc
    server {
        listen 18080 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/tls.conf;

        location / {
            proxy_pass http://hostnet:8080;
            include /etc/nginx/proxy.conf;
        }
    }
    # fuxa
    server {
        listen 11881 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/tls.conf;

        location / {
            proxy_pass http://hostnet:1881;
            include /etc/nginx/proxy.conf;
        }
    }
    # vhardware
    server {
        listen 18090 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/tls.conf;

        location / {
            proxy_pass http://hostnet:8090;
            include /etc/nginx/proxy.conf;
        }
    }
    # engineeringws
    server {
        listen 16080 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/tls.conf;

        location / {
            proxy_pass http://hostnet:6080;
            include /etc/nginx/proxy.conf;
        }
    }
    # attackmachine
    server {
        listen 16081 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/tls.conf;

        location / {
            proxy_pass http://hostnet:6081;
            include /etc/nginx/proxy.conf;
        }
    }
    # ids
    server {
        listen 18443 ssl;
        http2 on;
        server_name _;
        include /etc/nginx/tls.conf;

        location / {
            proxy_pass http://hostnet:8443;
            include /etc/nginx/proxy.conf;
        }
    }
}
