services:
  hwio:
    image: localhost:5000/cybics-hwio-raspberry:latest
    depends_on:
    - stm32
    - openplc
    restart: always
    privileged: true
    mem_limit: 48m
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/gpiochip0:/dev/gpiochip0"
    networks:
      br-cybics:
        ipv4_address: 172.18.0.2

  opcua:
    image: localhost:5000/cybics-opcua:latest
    depends_on:
    - openplc
    restart: always
    mem_limit: 64m
    ports:
      - 4840:4840
    networks:
      br-cybics:
        ipv4_address: 172.18.0.5

  s7com:
    image: localhost:5000/cybics-s7com:latest
    depends_on:
    - openplc
    restart: always
    mem_limit: 32m
    ports:
      - 1102:1102
    networks:
      br-cybics:
        ipv4_address: 172.18.0.6

  openplc:
    image: localhost:5000/cybics-openplc:latest
    restart: always
    mem_limit: 96m
    volumes:
      - /var/run:/var/run
    ports:
      - 44818:44818
      - 20000:20000
      - 8080:8080
      - 502:502
      - 102:102
    networks:
      br-cybics:
        ipv4_address: 172.18.0.3

  fuxa:
    image: localhost:5000/cybics-fuxa:latest
    restart: always
    mem_limit: 80m
    depends_on:
    - openplc
    ports:
      - 1881:1881
    volumes:
      - fuxa_data:/_appdata
    networks:
      br-cybics:
        ipv4_address: 172.18.0.4

  landing:
    image: localhost:5000/cybics-landing:latest
    restart: always
    mem_limit: 64m
    depends_on:
    - openplc
    - fuxa
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Single proxy in front of the landing page: 8082 is a raw TCP passthrough
  # that reaches the host-networked landing service from other machines even
  # behind a host firewall, 443 adds HTTPS.
  nginx-proxy:
    image: localhost:5000/cybics-nginx-proxy:latest
    restart: always
    mem_limit: 32m
    ports:
      - 8082:80
      - 443:443
      # One TLS port per embedded service (service port + 10000): an http://
      # iframe inside the https:// dashboard is mixed content and gets blocked.
      - 11881:11881
      - 16080:16080
      - 16081:16081
      - 18080:18080
      - 18090:18090
      - 18443:18443
    extra_hosts:
      - "hostnet:host-gateway"
    depends_on:
      - landing
    volumes:
      - nginx-certs:/etc/nginx/certs

  stm32:
    image: localhost:5000/cybics-stm32:latest
    privileged: true
    restart: always
    mem_limit: 32m
    # OpenOCD's GDB server halts the core on any incoming connection, and
    # nothing resumes it when the client disconnects. A service scan against
    # the device therefore stopped the physical process (#162). Only the Pi
    # itself may reach the port; debug from a workstation through an SSH
    # tunnel, see software/stm32/README.md.
    ports:
      - 127.0.0.1:3333:3333
    networks:
      br-cybics:
        ipv4_address: 172.18.0.7

  cybicsagent:
    image: localhost:5000/cybics-cybicsagent:latest
    restart: always
    depends_on:
    - openplc
    - landing
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../doc:/knowledge/doc:ro
      - ../training:/knowledge/training:ro
      - ../README.md:/knowledge/README.md:ro
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_MODEL=phi3:mini
    networks:
      br-cybics:
        ipv4_address: 172.18.0.11
  ids:
    image: localhost:5000/cybics-ids:latest
    restart: always
    mem_limit: 32m
    depends_on:
    - openplc
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

networks:
  br-cybics:
    name: br-cybics
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-cybics
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1

volumes:
  fuxa_data:
  ollama_models:
  nginx-certs:
