# Scroll back with the mouse wheel in the browser terminal.
set -g mouse on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -g default-command "bash -l"
set -g status-style "bg=#2d2d2d,fg=#ff6b00"
set -g status-left " attack-machine 172.18.0.100 "
set -g status-left-length 32
set -g status-right " Ctrl-b c: new window  Ctrl-b n: next "
set -g status-right-length 48
