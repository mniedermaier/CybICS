# Raw TCP reverse proxy for the landing page.
#
# The `landing` service runs with network_mode: host and binds 0.0.0.0:80.
# On hosts with a firewall (e.g. ufw) that port lives on the host INPUT chain
# and is blocked from other machines, while bridge-published ports bypass the
# firewall via Docker's iptables rules. This sidecar is a bridge container that
# publishes a port >8000 and forwards it, at the TCP layer, to the host's
# landing:80 -- so the landing page becomes reachable from other systems
# without any host firewall changes. TCP-level proxying passes HTTP,
# WebSockets and SSE through transparently.
events {}

stream {
    server {
        listen 80;
        # "hostnet" is mapped to the Docker host via extra_hosts: host-gateway
        proxy_pass hostnet:80;
    }
}
