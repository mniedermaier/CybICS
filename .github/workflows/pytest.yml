name: pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker system prune -af
        df -h

    - name: Install nmap
      run: sudo apt-get install -y nmap

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare environment
      run: |
        chmod +x ./.devcontainer/prepare-env.sh
        .devcontainer/prepare-env.sh
      shell: bash

    - name: Start containers
      run: docker-compose -f "docker-compose.yml" up -d --build
      working-directory: ./.devcontainer/virtual

    - name: Wait for services
      run: sleep 120s
      shell: bash

    - name: Install test dependencies
      run: pip install --no-cache-dir -r tests/requirements.txt

    # Run the whole suite rather than naming files one by one: a test file
    # that is not listed here is silently never executed, which is how
    # tests/test_plant_model_parity.py would have been added without ever
    # running in CI.
    - name: Run test suite
      run: pytest tests/ --verbose

    - name: Stop containers
      if: always()
      run: docker-compose -f "docker-compose.yml" down
      working-directory: ./.devcontainer/virtual
