name: devContainer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
  - cron: "0 0 * * *"

concurrency:
  # One run per workflow per ref.  Pull request runs are cancelled when a new
  # commit is pushed; runs on main are not -- every commit there should still
  # be built.  GitHub keeps at most one running plus one pending run per group,
  # so a burst of merges no longer piles up dozens of concurrent jobs (which
  # is how runs started failing at startup).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  raspberry2204:
    name: Run devcontainer test raspberry on Ubuntu 22.04
    runs-on: ubuntu-22.04

    env:
      # Exposed so the login step below can detect whether credentials exist.
      # Empty for fork PRs, which cannot read repository secrets at all.
      DOCKERHUB_RO_USERNAME: ${{ secrets.DOCKERHUB_RO_USERNAME }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h

      - name: Login to Docker Hub (read-only)
        # These jobs only PULL images, so they use a read-only token. The
        # push-capable DOCKERHUB_TOKEN stays exclusively in pushDockerRepos.yml
        # and is never present in a job that executes pull request code.
        # Authenticating raises the pull rate limit from 100/6h (anonymous) to
        # 200/h. Fork PRs cannot read secrets, so the guard lets them fall back
        # to anonymous pulls instead of failing the job.
        if: env.DOCKERHUB_RO_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_RO_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RO_TOKEN }}

      - name: Check out code
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Create environment files"
        run: .devcontainer/prepare-env.sh

      - name: run tests software
        uses: devcontainers/ci@v0.3
        env:
          BUILDX_CACHE_FROM: type=gha
          BUILDX_CACHE_TO: type=gha,mode=max
        with:
          configFile: .devcontainer/raspberry/devcontainer.json
          env: .devcontainer/raspberry/.env
          runCmd: |
            docker ps
            software/build.sh

  raspberry2404:
    name: Run devcontainer test raspberry on Ubuntu 24.04
    runs-on: ubuntu-24.04

    env:
      # Exposed so the login step below can detect whether credentials exist.
      # Empty for fork PRs, which cannot read repository secrets at all.
      DOCKERHUB_RO_USERNAME: ${{ secrets.DOCKERHUB_RO_USERNAME }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h

      - name: Login to Docker Hub (read-only)
        # These jobs only PULL images, so they use a read-only token. The
        # push-capable DOCKERHUB_TOKEN stays exclusively in pushDockerRepos.yml
        # and is never present in a job that executes pull request code.
        # Authenticating raises the pull rate limit from 100/6h (anonymous) to
        # 200/h. Fork PRs cannot read secrets, so the guard lets them fall back
        # to anonymous pulls instead of failing the job.
        if: env.DOCKERHUB_RO_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_RO_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RO_TOKEN }}

      - name: Check out code
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Create environment files"
        run: .devcontainer/prepare-env.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: run tests software
        uses: devcontainers/ci@v0.3
        env:
          BUILDX_CACHE_FROM: type=gha
          BUILDX_CACHE_TO: type=gha,mode=max
        with:
          configFile: .devcontainer/raspberry/devcontainer.json
          env: .devcontainer/raspberry/.env
          runCmd: |
            docker ps
            software/build.sh

  stm32:
    name: Run devcontainer test stm32
    runs-on: ubuntu-latest

    env:
      # Exposed so the login step below can detect whether credentials exist.
      # Empty for fork PRs, which cannot read repository secrets at all.
      DOCKERHUB_RO_USERNAME: ${{ secrets.DOCKERHUB_RO_USERNAME }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h

      - name: Login to Docker Hub (read-only)
        # These jobs only PULL images, so they use a read-only token. The
        # push-capable DOCKERHUB_TOKEN stays exclusively in pushDockerRepos.yml
        # and is never present in a job that executes pull request code.
        # Authenticating raises the pull rate limit from 100/6h (anonymous) to
        # 200/h. Fork PRs cannot read secrets, so the guard lets them fall back
        # to anonymous pulls instead of failing the job.
        if: env.DOCKERHUB_RO_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_RO_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RO_TOKEN }}

      - name: Check out code
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Create environment files"
        run: .devcontainer/prepare-env.sh

      - name: run tests stm32
        run: docker compose -f .devcontainer/stm32/docker-compose.yml run --rm dev scripts/build.sh

  virtual:
    name: Run devcontainer test virtual
    runs-on: ubuntu-latest

    env:
      # Exposed so the login step below can detect whether credentials exist.
      # Empty for fork PRs, which cannot read repository secrets at all.
      DOCKERHUB_RO_USERNAME: ${{ secrets.DOCKERHUB_RO_USERNAME }}

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h

      - name: Login to Docker Hub (read-only)
        # These jobs only PULL images, so they use a read-only token. The
        # push-capable DOCKERHUB_TOKEN stays exclusively in pushDockerRepos.yml
        # and is never present in a job that executes pull request code.
        # Authenticating raises the pull rate limit from 100/6h (anonymous) to
        # 200/h. Fork PRs cannot read secrets, so the guard lets them fall back
        # to anonymous pulls instead of failing the job.
        if: env.DOCKERHUB_RO_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_RO_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RO_TOKEN }}

      - name: Check out code
        uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Create environment files"
        run: .devcontainer/prepare-env.sh

      - name: run tests for virtual environment
        uses: devcontainers/ci@v0.3
        env:
          BUILDX_CACHE_FROM: type=gha
          BUILDX_CACHE_TO: type=gha,mode=max
        with:
          configFile: .devcontainer/virtual/devcontainer.json
          env: .devcontainer/virtual/.env
          runCmd: |
            pwd
