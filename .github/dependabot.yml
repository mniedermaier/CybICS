version: 2

updates:
  # Python dependencies across every requirements.txt in the repo.
  # Grouped into a single weekly PR so the devcontainer jobs (~45 min each
  # for the Raspberry targets) are not run once per bumped package.
  - package-ecosystem: "pip"
    directories:
      - "/tests"
      - "/software/*"
      - "/training"
      - "/training/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "pip"

  # GitHub Actions used by the 8 workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
